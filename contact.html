  <section id="contact">
    <div class="container">
      <div class="contact-cta">
        <h2>Une idée en tête ?</h2>
        <p>Contacte-moi pour une commission, une collaboration, ou juste pour dire bonjour.</p>
        <a href="mailto:nekotsuki.studio@gmail.com" class="btn btn-primary">Envoyer un email</a>

        <!--
          FORMULAIRE FONCTIONNEL — via Formspree (gratuit, sans backend à héberger) :
          1. Va sur https://formspree.io et crée un compte gratuit avec nekotsuki.studio@gmail.com
          2. Crée un nouveau formulaire, Formspree te donne une URL du type https://formspree.io/f/xxxxxxx
          3. Remplace "TON_ID_FORMSPREE" ci-dessous par cet identifiant (juste la partie après /f/)
          4. Formspree t'enverra un email de confirmation la 1ère fois qu'un message est envoyé — clique pour valider
          Une fois branché, chaque message envoyé depuis le site atterrit directement dans ta boîte mail.
        -->
        <form class="contact-form ajax-form" id="contactForm" data-success-message="Message envoyé ! Je te réponds au plus vite." action="https://formspree.io/f/xvzeaeok" method="POST">
          <input type="hidden" name="_subject" value="Nouveau message — Nekotsuki Studio">
          <input type="text" name="_gotcha" style="display:none">
          <div>
            <label for="name">Nom</label>
            <input type="text" id="name" name="name" placeholder="Ton nom" required>
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="ton@email.com" required>
          </div>
          <div>
            <label for="type">Type de demande</label>
            <select id="type" name="type">
              <option>Commission</option>
              <option>Boutique</option>
              <option>Collaboration</option>
              <option>Question générale</option>
              <option>Autre</option>
            </select>
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Décris ton idée ou ta demande..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="align-self:center;">Envoyer le message</button>
          <div id="formStatus" class="form-status"></div>
        </form>
      </div>
    </div>
  </section>
